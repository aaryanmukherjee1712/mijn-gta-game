
<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mijn Open World Game</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    font-family: Arial;
    background: #87ceeb;
  }
  #info {
    position: absolute;
    top: 15px;
    left: 15px;
    color: white;
    background: #0009;
    padding: 14px;
    border-radius: 10px;
    z-index: 2;
  }
</style>
</head>
<body>
<div id="info">
  <b>MIJN OPEN WORLD GAME</b><br>
  WASD = Lopen<br>
  Muis = Camera draaien
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from "three";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 50, 180);

const camera = new THREE.PerspectiveCamera(
  70, window.innerWidth / window.innerHeight, 0.1, 500
);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

// Licht
const sun = new THREE.DirectionalLight(0xffffff, 3);
sun.position.set(30, 60, 20);
sun.castShadow = true;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xffffff, 0x667755, 2));

// Grond
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(300,300),
  new THREE.MeshStandardMaterial({color:0x567d42})
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// Wegen
function road(x,z,w,d) {
  const r = new THREE.Mesh(
    new THREE.BoxGeometry(w,0.12,d),
    new THREE.MeshStandardMaterial({color:0x292929})
  );
  r.position.set(x,0.06,z);
  scene.add(r);
}

road(0,0,300,12);
road(0,0,12,300);

// Wegstrepen
for(let i=-140;i<150;i+=12) {
  const line = new THREE.Mesh(
    new THREE.BoxGeometry(5,0.04,0.3),
    new THREE.MeshBasicMaterial({color:0xffffff})
  );
  line.position.set(i,0.13,0);
  scene.add(line);
}

// Gebouwen
for(let x=-90;x<=90;x+=25) {
  for(let z=-90;z<=90;z+=25) {
    if(Math.abs(x)<15 || Math.abs(z)<15) continue;

    const height = 8+Math.random()*25;
    const width = 10+Math.random()*5;

    const building = new THREE.Mesh(
      new THREE.BoxGeometry(width,height,width),
      new THREE.MeshStandardMaterial({
        color:new THREE.Color().setHSL(
          0.55+Math.random()*0.12,0.12,0.35+Math.random()*0.3
        )
      })
    );

    building.position.set(x,height/2,z);
    building.castShadow = true;
    building.receiveShadow = true;
    scene.add(building);

    // Ramen
    for(let y=4;y<height-2;y+=4) {
      for(let side=-1;side<=1;side+=2) {
        const windowMesh = new THREE.Mesh(
          new THREE.BoxGeometry(0.15,1.5,2),
          new THREE.MeshBasicMaterial({color:0x9ed9ed})
        );
        windowMesh.position.set(
          x+side*(width/2+0.09),y,z
        );
        scene.add(windowMesh);
      }
    }
  }
}

// Speler
const player = new THREE.Group();

const body = new THREE.Mesh(
  new THREE.CapsuleGeometry(0.55,1.1,4,8),
  new THREE.MeshStandardMaterial({color:0x2455aa})
);
body.position.y = 1.1;
body.castShadow = true;
player.add(body);

const head = new THREE.Mesh(
  new THREE.SphereGeometry(0.38,16,16),
  new THREE.MeshStandardMaterial({color:0xe0ad83})
);
head.position.y = 2.25;
player.add(head);

player.position.set(0,0,8);
scene.add(player);

// Camera en besturing
let angle = 0;
let pitch = 0.3;
const keys = {};

window.addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;
});
window.addEventListener("keyup", e => {
  keys[e.key.toLowerCase()] = false;
});

let dragging = false;
let lastX = 0;
let lastY = 0;

renderer.domElement.addEventListener("pointerdown",e=>{
  dragging=true;
  lastX=e.clientX;
  lastY=e.clientY;
});
window.addEventListener("pointerup",()=>dragging=false);
window.addEventListener("pointermove",e=>{
  if(!dragging)return;
  angle -= (e.clientX-lastX)*0.005;
  pitch += (e.clientY-lastY)*0.003;
  pitch=Math.max(-0.1,Math.min(0.9,pitch));
  lastX=e.clientX;
  lastY=e.clientY;
});

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);

  let forward=0, side=0;
  if(keys["w"])forward=1;
  if(keys["s"])forward=-1;
  if(keys["a"])side=-1;
  if(keys["d"])side=1;

  const length=Math.hypot(forward,side);
  if(length>0) {
    forward/=length;
    side/=length;
    const speed=12*dt;
    const dx=(-Math.sin(angle)*forward+
              Math.cos(angle)*side)*speed;
    const dz=(-Math.cos(angle)*forward-
              Math.sin(angle)*side)*speed;

    player.position.x+=dx;
    player.position.z+=dz;
    player.rotation.y=Math.atan2(dx,dz);
  }

  const distance=9;
  const target=new THREE.Vector3(
    player.position.x+Math.sin(angle)*distance,
    player.position.y+4+pitch*5,
    player.position.z+Math.cos(angle)*distance
  );

  camera.position.lerp(target,0.12);
  camera.lookAt(
    player.position.x,
    player.position.y+1.3,
    player.position.z
  );

  renderer.render(scene,camera);
}
animate();

window.addEventListener("resize",()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});
</script>
</body>
</html>
